name: RSS to Blogger Bot

on:
  schedule:
    # Günde 1 kez çalışır (UTC 03:00 = TR saatiyle 06:00). GitHub'da cron UTC'dir.
    # Not: Önceden 15 dakikada birdi (günde 96 kez); bu da tek başına
    # ayda ~2880 dk'lık minimum faturalandırma anlamına geliyordu ve
    # ücretsiz plandaki 2000 dk/ay Actions sınırını tek başına aşıyordu.
    # Günlük çalıştırma, kullanımı ayda ~30 dk minimuma indirir.
    - cron: "0 3 * * *"
  workflow_dispatch: {}

concurrency:
  group: rss-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Repoyu al
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Bağımlılıkları yükle
        run: npm install

      - name: Bot'u çalıştır
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          BLOG_ID: ${{ secrets.BLOG_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: node index.js
